name: Deploy to GitHub Pages

# Publishes the app to the gh-pages branch; GitHub serves that branch as the
# Pages site. (Enabling Pages directly from a workflow needs admin rights the
# built-in token doesn't have, so we use the auto-enabled gh-pages convention.)
on:
  push:
    branches: [claude/meal-prep-grocery-app-z19f5b]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
