<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Groceries">
<meta name="theme-color" content="#2f9e44">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Groceries</title>
<style>
:root {
  --accent: #2f9e44;
  --accent-soft: #e6f4ea;
  --bg: #f6f7f8;
  --card: #ffffff;
  --text: #1c1f23;
  --muted: #6b7280;
  --line: #e3e6ea;
  --danger: #c0392b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #4cc764;
    --accent-soft: #1e2f23;
    --bg: #131517;
    --card: #1e2125;
    --text: #eceff2;
    --muted: #9aa3ad;
    --line: #32373d;
    --danger: #e0604f;
  }
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}
header {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
header h1 { font-size: 22px; }
main {
  padding: 16px 16px calc(env(safe-area-inset-bottom) + 92px);
  max-width: 640px; margin: 0 auto;
}
nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
  display: flex;
  background: var(--card);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1; padding: 10px 0 8px;
  background: none; border: none;
  font-size: 21px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
nav button span { font-size: 10px; font-weight: 600; }
nav button.active { color: var(--accent); }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}
.card.tappable { cursor: pointer; }
.card h3 { font-size: 17px; }
.sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
button.primary, button.secondary, button.danger-btn {
  display: block; width: 100%;
  padding: 14px; margin-top: 12px;
  border-radius: 12px; border: none;
  font-size: 17px; font-weight: 600;
  cursor: pointer;
}
button.primary { background: var(--accent); color: #fff; }
button.secondary { background: var(--accent-soft); color: var(--accent); }
button.danger-btn { background: none; color: var(--danger); }
button.ghost {
  background: none; border: none;
  font-size: 15px; font-weight: 600; color: var(--accent);
  padding: 6px 4px; cursor: pointer;
}
input, select, textarea {
  font: inherit; font-size: 16px;
  color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; width: 100%;
}
label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 15px; line-height: 1.5; }
.empty .big { font-size: 40px; display: block; margin-bottom: 8px; }
.chips { display: flex; gap: 8px; margin: 4px 0 14px; flex-wrap: wrap; }
.chip {
  padding: 9px 16px; border-radius: 20px;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.tag {
  display: inline-block; font-size: 10px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft);
  padding: 2px 7px; border-radius: 6px; margin-bottom: 3px;
}

/* recipe form ingredient rows */
.ing-row {
  display: grid;
  grid-template-columns: 62px 80px 1fr;
  gap: 6px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.ing-row .row2 { grid-column: 1 / -1; display: flex; gap: 6px; }
.ing-row .row2 select { flex: 1; }
.ing-row .row2 button {
  background: none; border: none; color: var(--danger);
  font-size: 20px; padding: 0 12px; cursor: pointer;
}
.pkg-row { display: flex; gap: 6px; }
.pkg-row input:first-child { flex: 0 0 90px; }
.macro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.rec-row { grid-template-columns: 30px 1fr 70px; align-items: center; }
.rec-row input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); }

/* plan */
.day h2 { font-size: 15px; color: var(--muted); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }
.day h2 .money { text-transform: none; letter-spacing: 0; }
.meal { display: flex; align-items: center; gap: 10px; }
.meal .info { flex: 1; min-width: 0; }
.meal .name { font-weight: 600; overflow-wrap: anywhere; }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper button {
  width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg);
  color: var(--accent); font-size: 20px; cursor: pointer;
}
.stepper .count { min-width: 30px; text-align: center; font-size: 14px; color: var(--muted); }
.meal .remove { background: none; border: none; color: var(--muted); font-size: 20px; padding: 4px 0 4px 8px; cursor: pointer; }
.addmeal {
  display: block; width: 100%;
  padding: 12px; border-radius: 12px;
  border: 1.5px dashed var(--line); background: none;
  color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer;
}

/* grocery list */
.section h2 {
  font-size: 14px; color: var(--accent);
  margin: 18px 0 6px; text-transform: uppercase; letter-spacing: 0.05em;
}
.item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; margin-bottom: 6px;
  cursor: pointer; -webkit-user-select: none; user-select: none;
}
.item .box {
  width: 24px; height: 24px; flex-shrink: 0;
  border: 2px solid var(--muted); border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px;
}
.item.done .box { background: var(--accent); border-color: var(--accent); }
.item.done .label { text-decoration: line-through; color: var(--muted); }
.item .qty { font-weight: 700; margin-right: 4px; }
.item .cost { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
.progress { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.money { font-weight: 700; color: var(--accent); }
.bigmoney { font-size: 26px; font-weight: 800; color: var(--accent); }
.statrow { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
.statrow + .statrow { border-top: 1px solid var(--line); }
.warn { color: var(--danger); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="page-title">Today</h1>
  <button class="ghost" onclick="go('backup')">Backup</button>
</header>
<main id="main"></main>
<nav>
  <button id="tab-today" onclick="go('today')">🏠<span>Today</span></button>
  <button id="tab-recipes" onclick="go('recipes')">📖<span>Recipes</span></button>
  <button id="tab-plan" onclick="go('plan')">📅<span>Plan</span></button>
  <button id="tab-list" onclick="go('list')">🛒<span>List</span></button>
  <button id="tab-prices" onclick="go('prices')">🏷<span>Items</span></button>
</nav>

<script>
"use strict";

// ---------- data ----------
const STORE_KEY = "groceries.v1";
const SECTIONS = [
  ["produce", "Produce"],
  ["meat", "Meat & Seafood"],
  ["dairy", "Dairy & Eggs"],
  ["bakery", "Bakery"],
  ["pantry", "Pantry"],
  ["frozen", "Frozen"],
  ["other", "Other"],
];
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const SLOTS = [
  ["breakfast", "Breakfast"],
  ["lunch", "Lunch"],
  ["dinner", "Dinner"],
  ["snack", "Snack"],
];

// Upgrades any older/imported data shape to the current one.
function migrate(d) {
  d.checked = d.checked || {};
  d.prices = d.prices || [];
  for (const m of d.plan) if (!m.slot) m.slot = "dinner";
  d.meta = d.meta || {};
  if (!d.meta.created) d.meta.created = Date.now();
  return d;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (Array.isArray(p.recipes) && Array.isArray(p.plan)) return migrate(p);
    }
  } catch (e) { /* corrupted storage: fall through to a fresh start */ }
  return migrate({ recipes: [], plan: [], checked: {}, prices: [] });
}

function save() {
  const json = JSON.stringify(data);
  localStorage.setItem(STORE_KEY, json);
  // second on-device copy, in case localStorage is wiped or corrupted
  if (typeof indexedDB !== "undefined") idbSet(json);
}

function isEmpty(d) {
  return !d.recipes.length && !d.plan.length && !d.prices.length;
}

// --- IndexedDB mirror (best-effort; failures are silently ignored) ---
const IDB_NAME = "groceries-mirror";

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbSet(json) {
  idbOpen().then((db) => {
    db.transaction("kv", "readwrite").objectStore("kv").put(json, "data");
  }).catch(() => {});
}

function idbGet() {
  return idbOpen().then((db) => new Promise((resolve, reject) => {
    const req = db.transaction("kv").objectStore("kv").get("data");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  })).catch(() => null);
}

// --- backup reminders ---
function needsBackupNudge() {
  if (isEmpty(data)) return false;
  const m = data.meta || {};
  if (m.snoozeUntil && Date.now() < m.snoozeUntil) return false;
  const last = m.lastBackup || m.created || 0;
  return Date.now() - last > 14 * 864e5;  // two weeks
}

function snoozeNudge() {
  data.meta.snoozeUntil = Date.now() + 7 * 864e5;
  save();
  render();
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

let data = load();
let restoredFromMirror = false;  // true when boot recovered data from IndexedDB
let view = "today";
let editingId = null;       // recipe id when editing, null when creating
let editingPriceId = null;  // price item id when editing
let prefillPriceName = "";  // name to prefill in the price form
let pickDay = 0;            // day index the recipe picker is adding to
let pickSlot = "dinner";    // slot the recipe picker is adding to

// ---------- quantities ----------
// Accepts "1.5", "1,5", "1/2", "1 1/2". Returns a number or null.
function parseQty(s) {
  s = (s || "").trim().replace(",", ".");
  if (!s) return null;
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if (m) return +m[1] + (+m[2]) / (+m[3]);
  m = s.match(/^(\d+)\/(\d+)$/);
  if (m) return (+m[1]) / (+m[2]);
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

const FRACTIONS = [[0.25, "¼"], [1 / 3, "⅓"], [0.5, "½"], [2 / 3, "⅔"], [0.75, "¾"]];

function formatQty(n) {
  if (n == null) return "";
  const whole = Math.floor(n + 1e-9);
  const frac = n - whole;
  if (frac < 0.02) return String(whole);
  for (const [v, ch] of FRACTIONS) {
    if (Math.abs(frac - v) < 0.02) return whole ? whole + " " + ch : ch;
  }
  return String(+n.toFixed(2));
}

// ---------- costs ----------
// Units convertible within weight ("m") and volume ("v"). Anything else
// (pieces, cans, bunches…) only matches an identical unit string.
const UNIT_BASE = {
  g: ["m", 1], kg: ["m", 1000], oz: ["m", 28.35], lb: ["m", 453.6],
  ml: ["v", 1], l: ["v", 1000], tsp: ["v", 4.93], tbsp: ["v", 14.79],
  cup: ["v", 236.6], cups: ["v", 236.6],
};

function toBase(qty, unit) {
  unit = (unit || "").trim().toLowerCase();
  const u = UNIT_BASE[unit];
  if (u) return { dim: u[0], amount: qty * u[1] };
  return { dim: "x:" + unit, amount: qty };
}

function findPrice(name) {
  name = name.trim().toLowerCase();
  return data.prices.find((p) => p.name.trim().toLowerCase() === name);
}

// Items can carry a price, macros, or both — only cost with a real price.
// (Strict number check matters: in JS `null >= 0` is true.)
function hasValidPrice(p) {
  return !!p && p.qty > 0 && typeof p.price === "number" && p.price >= 0;
}

function fmtMoney(n) {
  return "$" + n.toFixed(2);
}

// Cost of one ingredient line at the given scale.
// Returns a number, or null when it can't be costed (no price saved,
// incompatible units). Unmeasured ingredients ("to taste") cost nothing.
function ingredientCost(ing, scale) {
  if (ing.qty == null) return 0;
  const p = findPrice(ing.name);
  if (!hasValidPrice(p)) return null;
  const need = toBase(ing.qty * scale, ing.unit);
  const pkg = toBase(p.qty, p.unit);
  if (need.dim !== pkg.dim) return null;
  return p.price * need.amount / pkg.amount;
}

// Cost of a planned meal: { total, unknown } where unknown counts
// measured ingredients that couldn't be costed.
function mealCost(meal) {
  const r = data.recipes.find((x) => x.id === meal.recipeId);
  if (!r) return { total: 0, unknown: 0 };
  const scale = r.servings > 0 ? meal.servings / r.servings : 1;
  let total = 0, unknown = 0;
  for (const ing of r.ingredients) {
    const c = ingredientCost(ing, scale);
    if (c == null) unknown++;
    else total += c;
  }
  return { total, unknown };
}

function sumCosts(meals) {
  let total = 0, unknown = 0;
  for (const m of meals) {
    const c = mealCost(m);
    total += c.total;
    unknown += c.unknown;
  }
  return { total, unknown };
}

function costLabel(c) {
  let s = `<span class="money">${fmtMoney(c.total)}</span>`;
  if (c.unknown) s += ` <span class="warn">· ${c.unknown} unpriced</span>`;
  return s;
}

// ---------- macros ----------
// Macros for one ingredient line at the given scale, from the item's
// per-label-amount nutrition. Returns {kcal, protein, carbs, fat},
// false for unmeasured ingredients, or null when not computable.
function ingredientMacros(ing, scale) {
  if (ing.qty == null) return false;
  const p = findPrice(ing.name);
  const m = p && p.macros;
  if (!m || !(m.qty > 0)) return null;
  const need = toBase(ing.qty * scale, ing.unit);
  const ref = toBase(m.qty, m.unit);
  if (need.dim !== ref.dim) return null;
  const k = need.amount / ref.amount;
  return { kcal: (m.kcal || 0) * k, protein: (m.protein || 0) * k,
           carbs: (m.carbs || 0) * k, fat: (m.fat || 0) * k };
}

// Whole-meal macros: totals plus how many measured ingredients were
// tracked vs. untracked.
function mealMacros(meal) {
  const out = { kcal: 0, protein: 0, carbs: 0, fat: 0, tracked: 0, untracked: 0 };
  const r = data.recipes.find((x) => x.id === meal.recipeId);
  if (!r) return out;
  const scale = r.servings > 0 ? meal.servings / r.servings : 1;
  for (const ing of r.ingredients) {
    const m = ingredientMacros(ing, scale);
    if (m === false) continue;
    if (m === null) { out.untracked++; continue; }
    out.kcal += m.kcal; out.protein += m.protein;
    out.carbs += m.carbs; out.fat += m.fat;
    out.tracked++;
  }
  return out;
}

// Sum of one serving of each given meal — "what one person eats".
function perServingMacros(meals) {
  const out = { kcal: 0, protein: 0, carbs: 0, fat: 0, tracked: 0, untracked: 0 };
  for (const meal of meals) {
    const m = mealMacros(meal);
    const s = Math.max(1, meal.servings);
    out.kcal += m.kcal / s; out.protein += m.protein / s;
    out.carbs += m.carbs / s; out.fat += m.fat / s;
    out.tracked += m.tracked; out.untracked += m.untracked;
  }
  return out;
}

// Compact per-serving macro line for a meal card ("" when nothing tracked).
function macroSub(meal) {
  const m = mealMacros(meal);
  if (!m.tracked) return "";
  const s = Math.max(1, meal.servings);
  let t = `${Math.round(m.kcal / s)} kcal · ${Math.round(m.protein / s)}P ${Math.round(m.carbs / s)}C ${Math.round(m.fat / s)}F / serving`;
  if (m.untracked) t += ` <span class="warn">· ${m.untracked} untracked</span>`;
  return `<div class="sub">${t}</div>`;
}

// Ingredient names used in the plan that have no usable price (deduplicated).
function unpricedNames() {
  const names = new Map();
  for (const meal of data.plan) {
    const r = data.recipes.find((x) => x.id === meal.recipeId);
    if (!r) continue;
    for (const ing of r.ingredients) {
      if (ing.qty == null) continue;
      if (!hasValidPrice(findPrice(ing.name))) {
        names.set(ing.name.trim().toLowerCase(), ing.name.trim());
      }
    }
  }
  return [...names.values()].sort();
}

// ---------- grocery list ----------
// Merges all planned ingredients by (name, unit), scaled by servings.
// Returns [[sectionLabel, items], ...] in store-walk order.
function buildList() {
  const map = new Map();
  for (const meal of data.plan) {
    const r = data.recipes.find((x) => x.id === meal.recipeId);
    if (!r) continue;
    const scale = r.servings > 0 ? meal.servings / r.servings : 1;
    for (const ing of r.ingredients) {
      const key = ing.name.trim().toLowerCase() + "|" + (ing.unit || "").trim().toLowerCase();
      let e = map.get(key);
      if (!e) {
        e = { key, name: ing.name.trim(), unit: (ing.unit || "").trim(),
              qty: 0, hasQty: false, unmeasured: false, section: ing.section || "other" };
        map.set(key, e);
      }
      if (ing.qty != null) { e.qty += ing.qty * scale; e.hasQty = true; }
      else e.unmeasured = true;
    }
  }
  const groups = [];
  for (const [secKey, secLabel] of SECTIONS) {
    const items = [...map.values()]
      .filter((e) => e.section === secKey)
      .sort((a, b) => a.name.localeCompare(b.name));
    if (items.length) groups.push([secLabel, items]);
  }
  return groups;
}

// Whole packages needed for a merged list item, or null if not costable.
// Returns { packages, cost, pkgLabel }.
function itemPurchase(item) {
  if (!item.hasQty) return null;
  const p = findPrice(item.name);
  if (!hasValidPrice(p)) return null;
  const need = toBase(item.qty, item.unit);
  const pkg = toBase(p.qty, p.unit);
  if (need.dim !== pkg.dim) return null;
  const packages = Math.max(1, Math.ceil(need.amount / pkg.amount - 1e-6));
  return { packages, cost: packages * p.price,
           pkgLabel: `${formatQty(p.qty)} ${p.unit || "×"}`.trim() };
}

// ---------- rendering ----------
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function go(v, day) {
  view = v;
  if (day !== undefined) pickDay = day;
  render();
  window.scrollTo(0, 0);
}

function render() {
  const main = document.getElementById("main");
  const titles = { today: "Today", recipes: "Recipes",
                   form: editingId ? "Edit recipe" : "New recipe",
                   plan: "This week", pick: "Add to " + DAYS[pickDay],
                   list: "Grocery list", prices: "Items",
                   priceform: editingPriceId ? "Edit item" : "New item",
                   scanreceipt: "Scan receipt", backup: "Backup" };
  document.getElementById("page-title").textContent = titles[view];
  const tabFor = { today: "today", recipes: "recipes", form: "recipes",
                   plan: "plan", pick: "plan", list: "list",
                   prices: "prices", priceform: "prices", scanreceipt: "prices" };
  for (const t of ["today", "recipes", "plan", "list", "prices"]) {
    document.getElementById("tab-" + t).classList.toggle("active", tabFor[view] === t);
  }
  if (view === "today") main.innerHTML = renderToday();
  else if (view === "recipes") main.innerHTML = renderRecipes();
  else if (view === "form") renderForm(main);
  else if (view === "plan") main.innerHTML = renderPlan();
  else if (view === "pick") main.innerHTML = renderPick();
  else if (view === "list") main.innerHTML = renderList();
  else if (view === "prices") main.innerHTML = renderPrices();
  else if (view === "priceform") main.innerHTML = renderPriceForm();
  else if (view === "scanreceipt") main.innerHTML = renderScanReceipt();
  else if (view === "backup") main.innerHTML = renderBackup();
}

// ----- today dashboard -----
function todayIndex() {
  return (new Date().getDay() + 6) % 7;  // JS Sunday=0 → our Monday=0
}

function renderToday() {
  const d = todayIndex();
  const dateLabel = new Date().toLocaleDateString(undefined,
    { weekday: "long", month: "short", day: "numeric" });
  const todays = data.plan.filter((m) => m.day === d);
  let html = `<div class="sub" style="margin-bottom:12px">${esc(dateLabel)}</div>`;

  if (restoredFromMirror) {
    html += `<div class="card" style="border-color:var(--accent)">
      <h3>Data restored</h3>
      <div class="sub">The phone's main storage came up empty, so your data was restored
      from the device's automatic second copy. Worth exporting a backup file now.</div>
      <button class="secondary" onclick="exportData();restoredFromMirror=false;render()">Back up now</button>
    </div>`;
  }
  if (needsBackupNudge()) {
    html += `<div class="card" style="border-color:var(--accent)">
      <h3>Time to back up</h3>
      <div class="sub">It's been a while since your last export. Your data lives only on

  if (!todays.length) {
    html += `<div class="empty"><span class="big">🍽</span>

      <button class="secondary" onclick="go('pick',${d})">＋ Plan something for today</button>`;

      const meals = todays.filter((m) => m.slot === slotKey);

    html += `<div class="card">
      <div class="sub">Today's food cost</div>
      <div class="bigmoney">${fmtMoney(todayCost.total)}</div>
      ${todayCost.unknown ? `<div class="warn">${todayCost.unknown} ingredient${todayCost.unknown === 1 ? "" : "s"} without a price — add them in Items</div>` : ""}
    </div>`;
    const nut = perServingMacros(todays);
    if (nut.tracked) {
      html += `<div class="card">
        <div class="sub" style="margin-bottom:4px">Today's nutrition — one serving of each meal</div>
        <div class="statrow"><span class="sub">Calories</span><b>${Math.round(nut.kcal)} kcal</b></div>
        <div class="statrow"><span class="sub">Protein</span><b>${Math.round(nut.protein)} g</b></div>
        <div class="statrow"><span class="sub">Carbs</span><b>${Math.round(nut.carbs)} g</b></div>
        <div class="statrow"><span class="sub">Fat</span><b>${Math.round(nut.fat)} g</b></div>
        ${nut.untracked ? `<div class="warn">${nut.untracked} ingredient use${nut.untracked === 1 ? "" : "s"} without nutrition info</div>` : ""}
      </div>`;

  if (data.plan.length) {

    for (const [, items] of buildList()) {

    run estimate counts the whole packages you'd buy.</div>`;
  }
  return html;
}

// ----- receipt & nutrition label parsing -----
// Receipt lines that are payment noise rather than purchased items.
const RECEIPT_SKIP = /\b(sub\s*total|total|tax|change|cash|card|visa|mastercard|amex|debit|credit|balance|due|payment|loyalty|points|savings|saved|refund|thank|receipt|cashier|invoice)\b|www\.|http/i;

// Pulls {name, price} item lines out of scanned receipt text.
// "AVOCADO 2 @ 1.50 3.00" uses the per-unit price; leading barcodes are stripped.
function parseReceiptText(text) {
  const out = [];
  for (let line of (text || "").split(/\n+/)) {
    line = line.trim();
    if (!line || RECEIPT_SKIP.test(line)) continue;
    let m = line.match(/^(.+?)\s+\d+\s*@\s*\$?(\d+[.,]\d{2})\b.*$/);
    if (!m) m = line.match(/^(.+?)\s+\$?(\d+[.,]\d{2})\s*[A-Za-z*]?$/);
    if (!m) continue;
    const price = parseFloat(m[2].replace(",", "."));
    const name = m[1].replace(/^[#*\s]+/, "").replace(/^\d{4,}\s*/, "")
      .replace(/\s{2,}/g, " ").trim().toLowerCase();
    if (!name || /^\d+$/.test(name)) continue;
    out.push({ name, price });
  }
  return out;
}

// Pulls serving size and macros out of scanned nutrition label text.
// Handles US "Nutrition Facts" and EU "per 100 g" styles; ignores
// saturated/trans fat and fiber/sugar sub-lines.
function parseNutritionText(text) {
  const out = {};
  const t = text || "";
  const serving = t.match(/serving size[^(\n]*\(\s*([\d.]+)\s*(g|ml)\s*\)/i)
    || t.match(/serving size[:\s]*([\d.]+)\s*(g|ml)\b/i)
    || t.match(/per\s*([\d.]+)\s*(g|ml)\b/i);
  if (serving) { out.qty = parseFloat(serving[1]); out.unit = serving[2].toLowerCase(); }
  for (const line of t.split(/\n+/)) {
    if (out.kcal == null) {
      let n;
      if (/calorie/i.test(line)) n = line.match(/(\d+(?:\.\d+)?)/);
      else if (/kcal/i.test(line)) n = line.match(/(\d+(?:\.\d+)?)\s*kcal/i);
      if (n) out.kcal = parseFloat(n[1]);
    }
    if (out.protein == null && /protein/i.test(line)) {
      const n = line.match(/([\d.]+)\s*g\b/i);
      if (n) out.protein = parseFloat(n[1]);
    }
    if (out.fat == null && /fat/i.test(line) && !/satur|trans/i.test(line)) {
      const n = line.match(/([\d.]+)\s*g\b/i);
      if (n) out.fat = parseFloat(n[1]);
    }
    if (out.carbs == null && /carb/i.test(line) && !/fib|sugar/i.test(line)) {
      const n = line.match(/([\d.]+)\s*g\b/i);
      if (n) out.carbs = parseFloat(n[1]);
    }
  }
  return out;
}

function saveReceiptItems() {
  let added = 0;
  for (const row of document.querySelectorAll(".rec-row")) {
    if (!row.querySelector(".rc-on").checked) continue;
    const name = row.querySelector(".rc-name").value.trim();
    const price = parseQty(row.querySelector(".rc-price").value.replace("$", ""));
    const qty = parseQty(row.querySelector(".rc-qty").value) || 1;
    const unit = row.querySelector(".rc-unit").value.trim();
    if (!name || price == null) continue;
    const existing = findPrice(name);  // re-scanning a receipt updates, not duplicates
    if (existing) Object.assign(existing, { name, qty, unit, price });
    else data.prices.push({ id: uid(), name, qty, unit, price });
    added++;
  }
  if (!added) { alert("Nothing checked — tick the items you want to add."); return; }
  save();
  go("prices");
}

      same unit word (or both leave it blank). An item can have a price, nutrition,
      or both.
    </div>`;
}

function toggleLabelScan() {
  const el = document.getElementById("label-scan");
  el.style.display = el.style.display === "none" ? "block" : "none";
}

function readLabel() {
  const r = parseNutritionText(document.getElementById("l-text").value);
  let found = 0;
  if (r.qty) {
    document.getElementById("m-qty").value = r.qty;
    document.getElementById("m-unit").value = r.unit;
    found++;
  }
  const fields = { kcal: "m-kcal", protein: "m-protein", carbs: "m-carbs", fat: "m-fat" };
  for (const k in fields) {
    if (r[k] != null) { document.getElementById(fields[k]).value = r[k]; found++; }
  }
  if (!found) alert("Couldn't find nutrition numbers in that text — you can type them in above.");
}

function savePrice() {
  const name = document.getElementById("p-name").value.trim();
  const qty = parseQty(document.getElementById("p-qty").value);
  const unit = document.getElementById("p-unit").value.trim();
  const price = parseQty(document.getElementById("p-price").value.replace("$", ""));
  if (!name) { alert("Give the item a name first."); return; }

  const mQty = parseQty(document.getElementById("m-qty").value);
  const mUnit = document.getElementById("m-unit").value.trim();
  const mVals = {};
  for (const f of ["kcal", "protein", "carbs", "fat"]) {
    mVals[f] = parseQty(document.getElementById("m-" + f).value);
  }
  const hasMacros = Object.values(mVals).some((v) => v != null);
  let macros;
  if (hasMacros) {
    if (!(mQty > 0)) { alert("Enter the amount the nutrition numbers are for (e.g. 100 g)."); return; }
    macros = { qty: mQty, unit: mUnit, kcal: mVals.kcal || 0, protein: mVals.protein || 0,
               carbs: mVals.carbs || 0, fat: mVals.fat || 0 };
  }

  const hasPrice = price != null;
  if (hasPrice && !(qty > 0)) { alert("Enter the package amount the price is for (e.g. 1 for 1 kg)."); return; }
  if (!hasPrice && !hasMacros) { alert("Enter a price, nutrition info, or both."); return; }

  const item = { name, qty, unit, price: hasPrice ? price : null };
  if (macros) item.macros = macros;

  let target = editingPriceId ? data.prices.find((x) => x.id === editingPriceId) : findPrice(name);
  if (target) {
    // same name twice would be ambiguous — update the existing item instead
    if (!macros) delete target.macros;
    Object.assign(target, item);
  } else {
    data.prices.push({ id: uid(), ...item });
  }
  save();
  go("prices");
}

function deletePrice() {
  const p = data.prices.find((x) => x.id === editingPriceId);
  if (!confirm(`Delete the price for “${p.name}”?`)) return;
  data.prices = data.prices.filter((x) => x.id !== editingPriceId);
  save();
  go("prices");
}

// ----- backup -----
function renderBackup() {
  const count = data.recipes.length;
  return `
    <div class="card">
      <h3>Your data lives on this phone</h3>
      <div class="sub" style="margin-top:6px; line-height:1.5">
        Everything (${count} recipe${count === 1 ? "" : "s"}, this week's plan, ${data.prices.length}
        saved item${data.prices.length === 1 ? "" : "s"}) is stored in this browser. Export a backup
        to the Files app every so often — it's one JSON file you can re-import here any time,
        including on a new phone.
      </div>
    </div>
    <button class="primary" onclick="exportData()">Export backup file</button>
    <button class="secondary" onclick="document.getElementById('import-file').click()">Import a backup</button>
    <input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importData(this)">
    <button class="secondary" onclick="go('today')">Back</button>
    <button class="danger-btn" onclick="eraseAll()">Erase all data</button>`;
}

function exportData() {
  data.meta.lastBackup = Date.now();
  save();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "groceries-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!Array.isArray(d.recipes) || !Array.isArray(d.plan)) throw new Error("bad shape");
      if (!confirm(`Replace everything here with this backup (${d.recipes.length} recipes)?`)) return;
      data = migrate({ recipes: d.recipes, plan: d.plan, checked: d.checked || {},
                       prices: d.prices || [], meta: d.meta || {} });
      save();
      go("today");
    } catch (e) {
      alert("That file doesn't look like a backup from this app.");
    }
  };
  reader.readAsText(file);
  input.value = "";
}

function eraseAll() {
  if (!confirm("Erase ALL recipes, plans and prices from this phone? Export a backup first if unsure.")) return;
  if (!confirm("Really erase everything? This cannot be undone.")) return;
  data = { recipes: [], plan: [], checked: {}, prices: [] };
  save();
  go("today");
}

// ---------- boot ----------
if (typeof window !== "undefined") {
  render();

  // If main storage came up empty but the IndexedDB mirror has data, restore it.
  if (isEmpty(data) && typeof indexedDB !== "undefined") {
    idbGet().then((raw) => {
      if (!raw) return;
      try {
        const p = JSON.parse(raw);
        if (Array.isArray(p.recipes) && Array.isArray(p.plan) && !isEmpty(p)) {
          data = migrate(p);
          save();
          restoredFromMirror = true;
          render();
        }
      } catch (e) { /* unreadable mirror: ignore */ }
    });
  }

  // Ask the browser to treat this origin's storage as persistent (best-effort).
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js");
  }

  // After a long suspension, reload to pick up the latest deployed version.
  // Every change is saved as it happens, so a reload never loses data —
  // but don't pull the page out from under a half-typed form.
  let hiddenAt = null;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 12 * 36e5
        && view !== "form" && view !== "priceform") {
      location.reload();
    }
  });
}
</script>
